# dsh-db bundle patch: inserts the dual-face plugin row into the web profile
# roster, exactly like the dsh-ssh bundle patch does.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (connection store, database engines, /api/dsh-db routes,
# agent tools), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client") load in the web GUI.
- insert:
    - id: db
      name: dsh-db
